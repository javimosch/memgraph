<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memgraph Graph</title>
  <link rel="stylesheet" href="/static/graph.css">
</head>
<body>
  <header>
    <h1>Memgraph Graph</h1>
    <div class="controls">
      <input id="search" type="text" placeholder="Search nodes..." autocomplete="off">
      <button id="copy-visible-paths" class="btn-action" title="Copy file paths of all visible nodes to clipboard">Copy Visible Paths</button>
      <button id="sync-btn" class="btn-action" title="Rescan and sync skills folder">Sync</button>
      <label><input type="checkbox" class="edge-toggle" value="references" checked> references</label>
      <label><input type="checkbox" class="edge-toggle" value="similar"> similar</label>
      <label><input type="checkbox" class="edge-toggle" value="shared-keyword"> shared-keyword</label>
    </div>
  </header>
  <main>
    <div id="cy"></div>
    <aside id="panel" class="hidden">
      <button id="panel-close" aria-label="Close">×</button>
      <button id="copy-md">Copy markdown</button>
      <div id="panel-content"></div>
    </aside>
  </main>
  <div id="tooltip" class="hidden"></div>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="/static/graph.js"></script>
</body>
</html>
