<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memgraph 3D</title>
  <link rel="stylesheet" href="/static/graph.css">
  <link rel="stylesheet" href="/static/v2.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>Memgraph 3D <a href="/" class="v2-link">2D</a> <a href="/v3" class="v2-link">Galaxy</a></h1>
    <div class="controls">
      <input id="search" type="text" placeholder="Search nodes..." autocomplete="off">
      <button id="copy-visible-paths" class="btn-action" title="Copy file paths of all visible nodes">Copy Visible Paths</button>
      <button id="sync-btn" class="btn-action" title="Rescan and sync">Sync</button>
      <label><input type="checkbox" class="edge-toggle" value="references" checked> references</label>
      <label><input type="checkbox" class="edge-toggle" value="similar"> similar</label>
      <label><input type="checkbox" class="edge-toggle" value="shared-keyword"> shared-keyword</label>
    </div>
  </header>
  <main>
    <div id="cy"></div>
    <aside id="panel" class="hidden">
      <button id="panel-close" aria-label="Close">×</button>
      <button id="copy-md">Copy markdown</button>
      <div id="panel-content"></div>
    </aside>
  </main>
  <div id="tooltip" class="hidden"></div>
  <script type="module" src="/static/v2.js"></script>
</body>
</html>
